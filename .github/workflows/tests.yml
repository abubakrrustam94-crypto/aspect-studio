name: Автотесты

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: Установка Chromium для Playwright
        run: npx playwright install --with-deps chromium
      - name: Основные тесты
        run: node tests/run.js
      - name: Тесты нагрузки (ZIP из 100 файлов, EXIF, крайние размеры)
        run: node tests/stress.js
      - name: Тесты входных форматов (HEIC, TIFF, RAW, PSD, EXR, XCF и др.)
        run: node tests/formats.js
      - name: Тесты приватности и экспорта (метаданные, sRGB/P3, имена, папка)
        run: node tests/privacy.js
      - name: Тесты водяного знака (мозаика, шаблоны)
        run: node tests/watermark.js
      - name: Тесты больших фото (авто-уменьшение при загрузке)
        run: node tests/large.js
      - name: Тесты «Что нового»
        run: node tests/whatsnew.js
      - name: Проверка доступности (axe)
        run: node tests/a11y.js
      - name: Тесты определения лиц (BlazeFace, офлайн)
        run: node tests/faces.js
      - name: Тесты удаления фона (U²-Net-P, офлайн)
        run: node tests/cutout.js
      - name: Тесты вкладки «Компоненты»
        run: node tests/components.js
