name: Автотесты

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: Установка Chromium для Playwright
        run: npx playwright install --with-deps chromium
      - name: Основные тесты
        run: node tests/run.js
      - name: Тесты нагрузки (ZIP из 100 файлов, EXIF, крайние размеры)
        run: node tests/stress.js
      - name: Тесты входных форматов (HEIC, TIFF, RAW, PSD, EXR, XCF и др.)
        run: node tests/formats.js
      - name: Тесты приватности и экспорта (метаданные, sRGB/P3, имена, папка)
        run: node tests/privacy.js
