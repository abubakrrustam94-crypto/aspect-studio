name: Автотесты

permissions:
  contents: read            # токен только на чтение: тесты ничего не пишут в репозиторий

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --require ./tools/csp-watch.js     # любой тест падает при нарушении политики безопасности
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Утилиты для проверки PDF
        run: sudo apt-get install -y poppler-utils
      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund       # по package-lock.json: те же версии, что проверены у автора
      - name: Статический аудит кода (необъявленные имена, дубли, офлайн-список)
        run: npm run audit
      - name: Установка Chromium для Playwright
        run: npx playwright install --with-deps chromium
      - name: Основные тесты
        run: node tests/run.js
      - name: Тесты нагрузки (ZIP из 100 файлов, EXIF, крайние размеры)
        run: node tests/stress.js
      - name: Тесты входных форматов (HEIC, TIFF, RAW, PSD, EXR, XCF и др.)
        run: node tests/formats.js
      - name: Тесты приватности и экспорта (метаданные, sRGB/P3, имена, папка)
        run: node tests/privacy.js
      - name: Тесты водяного знака (мозаика, шаблоны)
        run: node tests/watermark.js
      - name: Тесты больших фото (авто-уменьшение при загрузке)
        run: node tests/large.js
      - name: Тесты «Что нового»
        run: node tests/whatsnew.js
      - name: Проверка доступности (axe)
        run: node tests/a11y.js
      - name: Тесты определения лиц (BlazeFace, офлайн)
        run: node tests/faces.js
      - name: Тесты удаления фона (U²-Net-P, офлайн)
        run: node tests/cutout.js
      - name: Тесты вкладки «Компоненты»
        run: node tests/components.js
      - name: Тесты отмены, сессии и «Поделиться»
        run: node tests/session.js
      - name: Тесты параллельного экспорта
        run: node tests/speed.js
      - name: Тесты веса, пресетов и правки маски
        run: node tests/quality.js
      - name: Тесты вкладки «Метаданные»
        run: node tests/meta.js
      - name: Тесты точного удаления фона (IS-Net, ONNX)
        run: node tests/cutout2.js
      - name: Сжатие и форматы вывода (блок L)
        run: node tests/encode.js
      - name: RAW через LibRaw (блок M)
        run: node tests/raw.js
      - name: Нейро-увеличение (блок N)
        run: node tests/sr.js
      - name: Лица и объекты (блок O)
        run: node tests/detect.js
      - name: Нейро-шумоподавление (блок P1)
        run: node tests/denoise.js
      - name: Убрать лишнее (блок P2)
        run: node tests/erase.js
      - name: Цветовые профили ICC (блок P3)
        run: node tests/icc.js
      - name: Компоненты в OPFS и фоновая загрузка
        run: node tests/opfs.js
      - name: Многопоточные нейросети (блок Q2)
        run: node tests/threads.js
      - name: Поиск, избранное, до/после, пауза (блок Q3)
        run: node tests/ui3.js
      - name: Наборы размеров и выбор объекта (блок Q4)
        run: node tests/q4.js
      - name: Тема, свайпы, галерея, защита привязок (блок Q5)
        run: node tests/q5.js
      - name: Края фона и вставка (блок R1)
        run: node tests/r1.js
      - name: Сравнение форматов (блок R3)
        run: node tests/r3.js
      - name: Кнопки и уведомления (исправления интерфейса)
        run: node tests/ui4.js
      - name: Тон, стили и горизонт (блок R4)
        run: node tests/r4.js
      - name: A/B, подсказки, большие фото (блок R5)
        run: node tests/r5.js
      - name: PDF, иконки, кадры (блок C1)
        run: node tests/c1.js
      - name: Глубина и текст (блок C2)
        run: node tests/c2.js
      - name: Ночной свет (блок C3)
        run: node tests/c3.js
      - name: Пресеты, имена, перенос настроек (блок A1)
        run: node tests/a1.js
      - name: Улучшить, маски, шум, фокус (блок B1)
        run: node tests/b1.js
      - name: Сессия, копия настроек, макеты (блок C5)
        run: node tests/c5.js
      - name: Английский, доступность, слабый телефон (блок D1)
        run: node tests/d1.js
      - name: SEO-страницы, счётчик, отчёт о проблеме (блок D, v2.57)
        run: node tests/d2.js
      - name: Планшет, «Как это работает» (блок C, v2.56)
        run: node tests/c1.js
      - name: Водяной знак, наборы, приём фото (блок B, v2.55)
        run: node tests/b1.js
      - name: Подсказки на старте (блок A, v2.54)
        run: node tests/a1.js
      - name: Текст на фото и удаление объектов (блок E1)
        run: node tests/e1.js
      - name: Безопасность (блок E2)
        run: node tests/sec.js
      - name: Интерфейс и иконки (блок E3)
        run: node tests/ui5.js
      - name: Умная ретушь (блок C4)
        run: node tests/c4.js
      - name: Тон: дизеринг, стили, зерно (блок T2)
        run: node tests/t2.js
      - name: Ленивая загрузка и скорость (блок PERF)
        run: node tests/perf.js
      - name: Бюджет размера старта
        run: node tools/size-report.js --check
      - name: Безопасность (блок S1)
        run: node tests/s1.js
      - name: Интерфейс на телефоне (UX)
        run: node tests/ux.js
      - name: Сбой загрузки скриптов
        run: node tests/boot.js
