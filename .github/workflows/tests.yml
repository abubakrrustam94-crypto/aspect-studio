name: Автотесты

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: Статический аудит кода (необъявленные имена, дубли, офлайн-список)
        run: npm run audit
      - name: Установка Chromium для Playwright
        run: npx playwright install --with-deps chromium
      - name: Основные тесты
        run: node tests/run.js
      - name: Тесты нагрузки (ZIP из 100 файлов, EXIF, крайние размеры)
        run: node tests/stress.js
      - name: Тесты входных форматов (HEIC, TIFF, RAW, PSD, EXR, XCF и др.)
        run: node tests/formats.js
      - name: Тесты приватности и экспорта (метаданные, sRGB/P3, имена, папка)
        run: node tests/privacy.js
      - name: Тесты водяного знака (мозаика, шаблоны)
        run: node tests/watermark.js
      - name: Тесты больших фото (авто-уменьшение при загрузке)
        run: node tests/large.js
      - name: Тесты «Что нового»
        run: node tests/whatsnew.js
      - name: Проверка доступности (axe)
        run: node tests/a11y.js
      - name: Тесты определения лиц (BlazeFace, офлайн)
        run: node tests/faces.js
      - name: Тесты удаления фона (U²-Net-P, офлайн)
        run: node tests/cutout.js
      - name: Тесты вкладки «Компоненты»
        run: node tests/components.js
      - name: Тесты отмены, сессии и «Поделиться»
        run: node tests/session.js
      - name: Тесты параллельного экспорта
        run: node tests/speed.js
      - name: Тесты веса, пресетов и правки маски
        run: node tests/quality.js
      - name: Тесты вкладки «Метаданные»
        run: node tests/meta.js
      - name: Тесты точного удаления фона (IS-Net, ONNX)
        run: node tests/cutout2.js
      - name: Сжатие и форматы вывода (блок L)
        run: node tests/encode.js
      - name: RAW через LibRaw (блок M)
        run: node tests/raw.js
      - name: Нейро-увеличение (блок N)
        run: node tests/sr.js
      - name: Лица и объекты (блок O)
        run: node tests/detect.js
      - name: Нейро-шумоподавление (блок P1)
        run: node tests/denoise.js
      - name: Убрать лишнее (блок P2)
        run: node tests/erase.js
      - name: Цветовые профили ICC (блок P3)
        run: node tests/icc.js
      - name: Компоненты в OPFS и фоновая загрузка
        run: node tests/opfs.js
      - name: Многопоточные нейросети (блок Q2)
        run: node tests/threads.js
      - name: Поиск, избранное, до/после, пауза (блок Q3)
        run: node tests/ui3.js
      - name: Наборы размеров и выбор объекта (блок Q4)
        run: node tests/q4.js
      - name: Тема, свайпы, галерея, защита привязок (блок Q5)
        run: node tests/q5.js
      - name: Края фона и вставка (блок R1)
        run: node tests/r1.js
